<VirtualHost *:%http_port%>
    ServerAdmin webmaster@%site%.test
    DocumentRoot %root%
    ServerName %site%.test
    ServerAlias www.%site%.test %site%.dev www.%site%.dev

    <Directory %root%>
       Options Indexes FollowSymLinks
       AllowOverride All
       Require all granted
    </Directory>

    ErrorLog  %log_dir%/%site%.test_error.log
    CustomLog %log_dir%/%site%.test_access.log combined
</VirtualHost>

<VirtualHost *:%ssl_port%>
    ServerAdmin webmaster@%site%.test
    DocumentRoot %root%
    ServerName %site%.test
    ServerAlias www.%site%.test %site%.dev www.%site%.dev

    <Directory %root%>
       Options Indexes FollowSymLinks
       AllowOverride All
       Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile    %ssl_cert%
    SSLCertificateKeyFile %ssl_key%

    ErrorLog  %log_dir%/%site%.test_ssl_error.log
    CustomLog %log_dir%/%site%.test_ssl_access.log combined
</VirtualHost>
